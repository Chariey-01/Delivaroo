name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test -- --ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Tests and Build
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key-not-used-outside-tests
      JWT_SECRET_KEY: ci-jwt-secret-key-not-used-outside-tests
      DATABASE_URL: postgresql://deliveroo_user:deliveroo_pass@localhost:5432/deliveroo_test
      TEST_DATABASE_URL: postgresql://deliveroo_user:deliveroo_pass@localhost:5432/deliveroo_test

    defaults:
      run:
        working-directory: backend

    # tests/conftest.py builds TestConfig against a real Postgres (db.create_all()
    # per test), so the suite needs a live server rather than an in-memory stand-in.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deliveroo_user
          POSTGRES_PASSWORD: deliveroo_pass
          POSTGRES_DB: deliveroo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify migrations
        run: flask --app run:app db upgrade

      - name: Run backend tests
        run: pytest

      - name: Verify Python compilation
        run: python3 -m compileall app
